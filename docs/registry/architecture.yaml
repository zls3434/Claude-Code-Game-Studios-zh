# 架构决策注册表
#
# 用途：所有 ADR 必须遵循的关键架构立场的唯一事实来源。
# Skill 在写入新 ADR 之前检查此文件，以便在编写阶段就检测冲突 ——
# 避免在存在相互矛盾的决策基础上创建 story。
#
# 规则：
#   - 当某一立场约束着其他系统的构建方式时，才将其注册。
#     仅影响单个 ADR 的内部实现细节无需注册。
#   - 永远不要删除条目 —— 改用 status: superseded_by: ADR-NNNN。
#   - 当立场变更时：更新条目，设置 revised: 为当天日期，添加注释记录旧值，
#     并运行 /architecture-review 检查哪些 ADR 现已失效。
#   - adr: 是权威来源。所有依赖此立场的其他 ADR 在 referenced_by 列出自身。
#
# 由写入：/architecture-decision（阶段 5 —— ADR 批准后）
# 由读取：/architecture-decision（步骤 2 —— 开始编写前）
#         /architecture-review（阶段 4 —— 跨 ADR 冲突基线）
#         /create-stories（将架构约束嵌入 story）
#         /dev-story（对照已接受的立场检查实施）
#
# 搜索模式（供使用 Grep 的 Skill 使用）：
#   所有状态所有者：         Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   谁拥有 player_health：   Grep pattern="state: player_health"
#   所有信号合约：           Grep pattern="pattern: signal"
#   combat 的预算：          Grep pattern="system: combat"
#   所有禁用模式：           Grep pattern="^  - pattern:"（forbidden_patterns 章节）
#   已废弃的条目：           Grep pattern="status: superseded"

version: 1
last_updated: ""

# ─── 状态所有权 ─────────────────────────────────────────────────────────
# 每项共享游戏状态的权威所有者是谁。
# 冲突：两个 ADR 声称拥有相同状态 = 数据竞争 / 权限 bug。
#
# 当状态被多个系统读取或写入时，注册该状态。
# 仅内部使用的状态（从未被其他系统访问）无需注册。
#
# 必需字段：state、owner_system、adr、interface、referenced_by[]、added
# interface：其他系统如何访问此状态（只读属性、方法调用、信号、
#   共享资源等）—— 这是其他 ADR 所依赖的合约。

state_ownership: []

# 示例：
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health（只读 float，范围 0–max_health）"
#     write_access: health-system-only   # 仅所有者可写入；其他系统只读
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # 读取以应用伤害
#       - docs/architecture/adr-0007-ui-system.md       # 读取以显示 HUD
#     added: 2026-03-26
#     revised: ""


# ─── 接口合约 ──────────────────────────────────────────────────────────
# 系统之间必须如何通信。
# 冲突：一个 ADR 期望信号，另一个期望直接调用 = 集成 bug。
#
# 当两个系统之间的通信模式已在 ADR 中明确决定，且其他系统必须
# 遵循相同模式时，注册一个合约。
#
# pattern 选项：signal | direct_call | event_bus | shared_resource | rpc | none

interfaces: []

# 示例：
#
# interfaces:
#   - contract: damage_delivery
#     status: active
#     pattern: signal          # 生产者如何通知消费者
#     producer: combat-system
#     consumers:
#       - health-system        # 接收 damage_dealt 信号，应用到生命值
#       - ui-system            # 接收 damage_dealt 信号，显示伤害数字
#       - audio-system         # 接收 damage_dealt 信号，播放 SFX
#     adr: docs/architecture/adr-0003-combat-system.md
#     signal_signature: "damage_dealt(amount: float, target: Node, is_crit: bool)"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#       - docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#     revised: ""


# ─── 性能预算 ──────────────────────────────────────────────────────────
# 每个系统的帧时间分配，以定义的总帧预算为基准。
# 冲突：分配总和超过总预算 = 无法发布。
#
# 当 ADR 明确声明了一个帧时间分配时，注册该项预算。
# 注册表让 /architecture-review 可以验证总和不超过目标值。

performance_budgets: []

# 示例：
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "包括物理查询、碰撞盒评估和伤害计算"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API 决策 ───────────────────────────────────────────────────────────
# 项目中针对哪些目的选用了哪些引擎 API。
# 冲突：两个 ADR 为相同目的使用不同的 API = 不一致的实现，
# 当一个系统期望另一个系统的 API 时会崩溃。
#
# 当 API 选择并非显而易见，且其他 ADR 在不知道该选择的情况下可能
# 为相同目的做出不同选择时，注册该 API 决策。

api_decisions: []

# 示例：
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # 明确禁止为此目的使用此方式
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "直接服务器调用避免了每帧节点开销；性能分析中快 3 倍"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── 禁用模式 ──────────────────────────────────────────────────────────
# 已被接受的 ADR 明确禁止的架构反模式。
# 编写新 ADR 时，检查此列表 —— 如果提议的方案匹配某个禁用模式，
# 则必须在 ADR 获得接受之前重新设计。
#
# 当 ADR 明确禁止某个模式，且其他 ADR 可能在不知情的情况下使用它
# （即这是一个诱人但错误的方法）时，注册该模式。

forbidden_patterns: []

# 示例：
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "系统不得直接按名称引用 Autoload 单例。
#       应使用依赖注入或信号来代替。"
#     why: "与 Autoload 的紧耦合使系统无法隔离测试，并创建了
#       隐藏的依赖关系，当 Autoload 加载顺序变化时会导致崩溃。"
#     adr: docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#
#   - pattern: direct_cross_system_state_write
#     status: active
#     description: "一个系统绝对不得直接写入另一个系统拥有的状态。
#       应使用信号或调用所有者的方法代替。"
#     why: "直接状态写入会产生竞态条件并破坏状态所有权模型。
#       拥有该状态的系统必须是唯一的写入者。"
#     adr: docs/architecture/adr-0000-architecture-principles.md
#     added: 2026-03-26
