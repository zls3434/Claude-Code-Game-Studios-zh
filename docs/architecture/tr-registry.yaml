# 翻译修改：2026-05-20, 修改人: zls3434
# 技术需求 ID 注册表
#
# 用途：每个 GDD 技术需求的持久、稳定 ID。
# 防止跨 `/architecture-review` 运行时 TR-ID 重新编号，
# 这会破坏故事引用。
#
# 规则：
#   - ID 是永久的。绝不重新编号，绝不删除（使用 status: deprecated）。
#   - 仅在每个系统列表的末尾添加新条目。
#   - 当 GDD 需求被重新措辞（相同意图）时：更新 `requirement`
#     文本并添加 `revised` 日期。ID 保持不变。
#   - 当需求从 GDD 中删除时：设置 status: deprecated。
#   - 当需求被拆分或替换时：设置 status: superseded-by 并附上
#     新的 TR-ID。
#
# 编写者：/architecture-review（追加新条目，绝不覆盖）
# 读取者：/create-stories（将 ID 嵌入故事）
#          /story-done（在审查时查找当前需求文本）
#          /story-readiness（验证 TR-ID 存在且为 active）
#
# ID 格式：TR-[系统缩写]-[NNN]
#   系统缩写 = 与 GDD 系统名称匹配的简短缩写
#   NNN = 每个系统的三位零填充序列，从 001 开始
#
# 状态值：active | deprecated | superseded-by: TR-[系统]-NNN

version: 1
last_updated: ""

requirements: []

