# 游戏世界实体注册表
#
# 用途：所有出现在多个文档中的命名游戏世界事实的单一真实来源。
# Skill 在编写新内容之前检查此处，以发现跨文档差异。
#
# 规则：
#   - 仅注册跨越系统边界的实体事实。仅内部事实
#     （仅在单个 GDD 中使用的公式）无需注册。
#   - 绝不删除条目 — 改为设置 status: deprecated。
#   - 当值改变时：更新值，将 revised: 设置为今天日期，
#     并添加注释说明旧值和哪个 GDD 更改了它。
#   - source: 是权威 GDD — "拥有"该项事实的 GDD。
#     引用它的其他 GDD 在 referenced_by 中列出自己。
#   - 当新 GDD 引用现有条目时，将其路径追加到
#     referenced_by。不要创建重复条目。
#
# 编写者：/design-system（第 5 阶段 — GDD 各部分批准后）
#          /consistency-check（解决冲突时）
# 读取者：/design-system（第 2 阶段 — 编写开始前，以及
#             C/D 部分写入后对新实体/公式进行冲突检查）
#          /consistency-check（主要输入 — grep 优先，GDD 次之）
#          /review-all-gdds（第 1 阶段 — 第 2 阶段检查的基线）
#          /architecture-review（数据结构和接口验证）
#
# 搜索模式（供使用 Grep 的 Skill）：
#   所有实体名称：         Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   特定实体：             Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   所有物品：             Grep pattern="^  - name:" path="design/registry/entities.yaml"（物品部分）
#   combat.md 拥有的内容：  Grep pattern="source: design/gdd/combat.md"
#   inventory.md 使用的内容：Grep pattern="referenced_by.*inventory"
#   所有金币值：           Grep pattern="value_gold:"
#   废弃条目：             Grep pattern="status: deprecated"
#
# 格式：YAML。一致的缩进对 grep 可靠性至关重要。
#   部分：entities | items | formulas | constants
#   每个条目：name、status、source、referenced_by[]、attributes{}、added、revised

version: 1
last_updated: ""

# ─── 实体 ────────────────────────────────────────────────────────────────
# 命名游戏世界对象：敌人、NPC、角色、阵营、Boss。
# 当一个实体出现在多个 GDD 中时，在此注册 — 例如，
# 在 combat.md 中定义的敌人也在 inventory.md 中列出了掉落物品。
#
# 必需字段：name、status、source、referenced_by、added
# 属性字段：可能出现在其他 GDD 中的任何关键属性
#   （生命值、伤害、掉落物、阵营等）

entities: []

# 示例（添加第一个真实条目后删除）：
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # 必须匹配物品部分中的条目
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── 物品 ───────────────────────────────────────────────────────────────────
# 命名收集品、装备、消耗品、制作材料、货币。
# 当物品名称或值出现在多个 GDD 中时注册。
#
# 必需字段：name、status、source、referenced_by、added
# 属性字段：value_gold、weight、stackable、category 以及
#   其他系统（如经济、制作）可能引用的任何属性修饰符。

items: []

# 示例：
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # 掉落定义在战斗 GDD 中
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # 背包 GDD 列出其重量/堆叠规则
#       - design/gdd/economy.md      # 经济 GDD 引用其出售价格
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── 公式 ────────────────────────────────────────────────────────────────
# 带有已定义变量和输出范围的命名计算。
# 当一个公式的输出馈入另一个系统的输入时注册，
# 或者当另一个 GDD 按名称引用它时。
#
# 必需字段：name、status、source、referenced_by、variables[]、
#   output_range[min, max]、added
# 可选：expression（实际公式）、notes

formulas: []

# 示例：
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # 进度 GDD 缩放攻击变量
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "输出馈入生命系统的伤害接收。最小值为 0（护甲
#       可吸收所有伤害）。最大值在公式中无上限，但 combat.md 中的
#       调优参数 damage_cap 限制在 999。"
#     added: 2026-03-26
#     revised: ""


# ─── 常量 ───────────────────────────────────────────────────────────────
# 跨多个系统引用的命名数值。
# 当一个常量在一个 GDD 中定义但另一个 GDD 必须
# 与其一致时注册（例如，经济中定义的金币携带上限但在背包
# 中检查，或背包中定义的背包槽位但在 HUD 中显示）。
#
# 必需字段：name、status、source、referenced_by、value、unit、added

constants: []

# 示例：
#
# constants:
#   - name: gold_carry_limit
#     status: active
#     source: design/gdd/economy.md
#     referenced_by:
#       - design/gdd/economy.md
#       - design/gdd/inventory.md   # 背包强制执行携带上限
#       - design/gdd/ui.md          # HUD 显示当前金币 vs 上限
#     value: 9999
#     unit: gold
#     added: 2026-03-26
#     revised: ""
#
#   - name: base_inventory_slots
#     status: active
#     source: design/gdd/inventory.md
#     referenced_by:
#       - design/gdd/inventory.md
#       - design/gdd/progression.md  # 进度解锁额外槽位
#     value: 20
#     unit: slots
#     added: 2026-03-26
#     revised: ""
