# 翻译修改：2026-05-20, 修改人: zls3434
# Workflow Catalog
# 由 /help 使用，用于确定用户所在的阶段及下一步该做什么。
#
# 产出物检查：
#   glob: 文件 glob 匹配模式 — 如果匹配到 ≥1 个文件（或 min_count 个）则视为完成
#   pattern: 必须出现在文件中的文本模式（在 glob 之后检查）
#   min_count: 最少匹配文件数（默认：1）
#   note: 当无法自动检测完成状态时的人工可读回退描述
#
# required: true → 阻止进入下一阶段（显示为 必需）
# required: false → 可选增强（显示为 可选）
# repeatable: true → 可多次运行（每个系统、每个 Story 等）
#
# 阶段关卡（/gate-check）：判定结果为 建议性 — 它们指导决策
# 但绝不会硬性阻止推进。用户始终决定是否继续。

phases:

  concept:
    label: "概念阶段"
    description: "将你的游戏创意发展为一个文档化的概念"
    next_phase: systems-design
    steps:
      - id: brainstorm
        name: "创意脑暴"
        command: /brainstorm
        required: false
        description: "使用 MDA、动词优先和玩家心理学框架探索游戏概念"

      - id: engine-setup
        name: "引擎配置"
        command: /setup-engine
        required: true
        artifact:
          glob: ".claude/docs/technical-preferences.md"
          pattern: "引擎: [^[]"
        description: "配置引擎、锁定版本、设置命名约定和性能预算"

      - id: game-concept
        name: "游戏概念文档"
        command: /brainstorm
        required: true
        artifact:
          glob: "design/gdd/game-concept.md"
        description: "正式确定概念，包含支柱、MDA 分析和范围层级"

      - id: design-review-concept
        name: "概念审查"
        command: /design-review
        required: false
        description: "验证游戏概念（建议在继续前执行）"

      - id: art-bible
        name: "美术圣经"
        command: /art-bible
        required: true
        artifact:
          glob: "design/art/art-bible.md"
        description: "编写视觉识别规范（9 个章节）。使用 /brainstorm 生成的视觉识别锚点。在游戏概念形成之后、系统设计之前运行。"

      - id: map-systems
        name: "系统映射"
        command: /map-systems
        required: true
        artifact:
          glob: "design/gdd/systems-index.md"
        description: "将概念分解为系统，包含依赖排序和优先级层级"

  systems-design:
    label: "系统设计阶段"
    description: "为系统索引中的每个系统编写 GDD"
    next_phase: technical-setup
    steps:
      - id: design-system
        name: "系统 GDD"
        command: /design-system
        required: true
        repeatable: true
        artifact:
          note: "检查 design/gdd/systems-index.md — 每个 MVP 系统需要 Status: Approved"
        description: "编写逐系统 GDD（引导式，逐章编写）。每个系统运行一次。"

      - id: design-review
        name: "逐系统设计审查"
        command: /design-review
        required: true
        repeatable: true
        description: "验证每个 GDD（8 个必需章节，不得出现 MAJOR REVISION 判定）。每个系统运行。"

      - id: review-all-gdds
        name: "跨 GDD 审查"
        command: /review-all-gdds
        required: true
        artifact:
          glob: "design/gdd/gdd-cross-review-*.md"
        description: "同时对所有 GDD 进行整体一致性检查 + 设计理论审查"

      - id: consistency-check
        name: "一致性检查"
        command: /consistency-check
        required: false
        repeatable: true
        description: "扫描所有 GDD 中的矛盾、未定义引用和机制冲突。在 /review-all-gdds 之后运行，在项目中期每次添加或修订 GDD 时再次运行。"

  technical-setup:
    label: "技术设置阶段"
    description: "架构决策、视觉识别规范、无障碍基础、引擎验证"
    next_phase: pre-production
    steps:
      - id: create-architecture
        name: "架构文档"
        command: /create-architecture
        required: true
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "编写涵盖所有系统的主架构文档"

      - id: architecture-decision
        name: "架构决策（ADR）"
        command: /architecture-decision
        required: true
        repeatable: true
        artifact:
          glob: "docs/architecture/adr-*.md"
          min_count: 3
        description: "将关键技术决策记录为 ADR。最低需要 3 个 Foundation 层 ADR。"

      - id: architecture-review
        name: "架构审查"
        command: /architecture-review
        required: true
        artifact:
          glob: "docs/architecture/architecture-review-*.md"
        description: "验证完整性、依赖排序、引擎兼容性"

      - id: control-manifest
        name: "控制清单"
        command: /create-control-manifest
        required: true
        artifact:
          glob: "docs/architecture/control-manifest.md"
        description: "从所有已接受的 ADR 生成平面程序员规则表"

      - id: accessibility-doc
        name: "无障碍需求"
        required: true
        artifact:
          glob: "design/accessibility-requirements.md"
        description: "确认无障碍等级（基础/标准/全面/示范）和功能矩阵。UX 规范（第四阶段）引用此等级。"

  pre-production:
    label: "预生产阶段"
    description: "视觉实体清单、UX 规范、资源规范、制作核心机制原型、定义 Story、验证趣味性"
    next_phase: production
    steps:
      - id: entity-inventory
        name: "视觉实体与界面清单"
        command: /asset-spec
        required: false
        artifact:
          glob: "design/assets/entity-inventory.md"
        description: "枚举游戏视觉上需要的一切：实体（角色、敌人、建筑、环境部件）、UI 界面、HUD 元素、面板。不带参数运行 /asset-spec 可启动协作清单会话 — 根据你的回答选择简要或详细。读取 GDD 和美术圣经以提出起始列表；你添加、删除和调整。成为所有美术和 UX 工作的真实数据源。如果游戏只有极少数视觉元素，则非必需。"

      - id: asset-spec
        name: "资源规范"
        command: /asset-spec
        required: false
        repeatable: true
        artifact:
          glob: "design/assets/asset-manifest.md"
        description: "生成单个资源的视觉规范和 AI 生成提示。每个实体、系统、关卡或角色运行一次。如果不存在源文档，/asset-spec 会内联询问你 — 无需叙事文档。"

      - id: ux-design
        name: "UX 规范（关键界面）"
        command: /ux-design
        required: true
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
          min_count: 3
        description: "为实体清单（或 GDD，如果没有清单）中识别的界面编写 UX 规范。最低要求：主菜单、核心玩法 HUD、暂停菜单。根据清单识别结果添加更多界面。从 technical-preferences.md 读取输入方式和平台信息。"

      - id: ux-review
        name: "UX 审查"
        command: /ux-review
        required: true
        description: "验证所有关键界面的 UX 规范是否符合 GDD 对齐度和无障碍等级要求。在创建 Epic 之前运行。"

      - id: prototype
        name: "原型"
        command: /prototype
        required: false
        artifact:
          glob: "prototypes/*/README.md"
          min_count: 1
        description: "构建一次性原型以在全面投入生产前验证核心机制是否有趣。推荐用于首次尝试的机制或高风险设计决策。已验证概念的个人开发者可以跳过。"

      - id: create-epics
        name: "创建 Epic"
        command: /create-epics
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/*/EPIC.md"
          min_count: 1
        description: "将 GDD + ADR 转化为 Epic — 每个架构模块一个 Epic。按层运行：/create-epics layer: foundation，然后 /create-epics layer: core"

      - id: create-stories
        name: "创建 Story"
        command: /create-stories
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/**/*.md"
          min_count: 2
        description: "将每个 Epic 分解为可实现的 Story 文件。每个 Epic 运行：/create-stories [epic-slug]"

      - id: test-setup
        name: "测试框架搭建"
        command: /test-setup
        required: false
        artifact:
          note: "检查 tests/ 目录是否存在引擎特定的测试框架脚手架"
        description: "在第一个 Sprint 之前一次性搭建测试框架和 CI 管线。之后可运行 /test-helpers 生成 Fixture、/qa-plan 按 Epic 生成测试计划、/smoke-check 按 Sprint 验证。"

      - id: sprint-plan
        name: "第一个 Sprint 计划"
        command: /sprint-plan
        required: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          min_count: 1
        description: "使用从 Epic 中优先排序的 Story 规划第一个 Sprint"

      - id: vertical-slice
        name: "垂直切片"
        command: /vertical-slice
        required: false
        artifact:
          glob: "prototypes/*/REPORT.md"
          min_count: 1
        description: "构建并试玩垂直切片 — 核心循环的完整端到端体验。推荐在提交 Epic 和 Story 到 Production 之前执行。跳过是个人开发者的有效选择，但会增加后期设计转向的风险。如果构建了，必须在推进前试玩并记录。"

  production:
    label: "生产阶段"
    description: "基于 Sprint 的功能开发 — 领取、实现、关闭 Story"
    next_phase: polish
    steps:
      - id: sprint-plan
        name: "Sprint 计划"
        command: /sprint-plan
        required: true
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "使用优先级排序的就绪 Story 规划当前 Sprint"

      - id: story-readiness
        name: "Story 就绪度检查"
        command: /story-readiness
        required: false
        description: "在开发人员领取之前验证 Story 是否可实现"

      - id: implement
        name: "实现 Story"
        command: /dev-story
        required: true
        repeatable: true
        artifact:
          note: "检查 src/ 中的活跃代码和 production/epics/**/*.md 中的 In Progress Story"
        description: "领取下一个就绪 Story 并使用 /dev-story [story-path] 实现它。路由到正确的程序员 Agent。"

      - id: code-review
        name: "代码审查"
        command: /code-review
        required: false
        repeatable: true
        description: "每个 Story 实现后的架构级代码审查。在 /dev-story 之后、/story-done 之前运行。"

      - id: story-done
        name: "Story 完成审查"
        command: /story-done
        required: true
        repeatable: true
        description: "验证所有验收标准、检查 GDD/ADR 偏差、关闭 Story"

      - id: qa-plan
        name: "QA 计划"
        command: /qa-plan
        required: false
        repeatable: true
        description: "为每个 Epic 或 Sprint 生成 QA 测试计划。运行 /qa-plan [epic-slug]。为 /smoke-check、/regression-suite 和 /test-evidence-review 生成测试用例。"

      - id: bug-report
        name: "Bug 报告 / 分类"
        command: /bug-report
        required: false
        repeatable: true
        description: "记录并优先级排序实现过程中发现的 Bug。/bug-report 创建结构化的报告；/bug-triage 对未解决积压进行优先级排序。"

      - id: retrospective
        name: "Sprint 回顾"
        command: /retrospective
        required: false
        repeatable: true
        description: "Sprint 后审查，捕捉有效的做法和需要改变的地方。在每个 Sprint 结束时、规划下一个 Sprint 之前运行。"

      - id: team-feature
        name: "团队编排（可选）"
        required: false
        repeatable: true
        description: "协调多个 Agent 处理复杂功能。使用：/team-combat、/team-narrative、/team-ui、/team-audio、/team-level、/team-live-ops、/team-qa。当功能跨越多个 Agent 领域时运行。"

      - id: scope-check
        name: "范围检查"
        command: /scope-check
        required: false
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          note: "当 Story 在 Sprint 中途被添加时，或在 Sprint 回顾之前运行"
        description: "通过比较当前 Sprint 范围与原始 Epic 范围来检测范围蔓延。在以下情况运行：(a) Story 在 Sprint 中途被添加时，或 (b) Sprint 回顾之前。"

      - id: sprint-status
        name: "Sprint 状态"
        command: /sprint-status
        required: false
        description: "无需完整报告的 Sprint 进度快速 30 行快照"

  polish:
    label: "打磨阶段"
    description: "性能、平衡、试玩、Bug 修复"
    next_phase: release
    steps:
      - id: perf-profile
        name: "性能分析"
        command: /perf-profile
        required: false
        description: "分析和优化 CPU/GPU/内存瓶颈"

      - id: balance-check
        name: "平衡检查"
        command: /balance-check
        required: false
        description: "分析游戏平衡公式和数据，查找异常值和断裂的成长曲线"

      - id: asset-audit
        name: "资源审计"
        command: /asset-audit
        required: false
        description: "验证命名约定、文件格式标准和大小预算"

      - id: playtest-polish
        name: "试玩会话（×3）"
        command: /playtest-report
        required: true
        artifact:
          glob: "production/playtests/*.md"
          min_count: 3
        description: "覆盖：新玩家体验、中期系统、难度曲线"

      - id: team-polish
        name: "打磨团队遍历"
        command: /team-polish
        required: true
        description: "跨性能、音频、视觉和 UX 的协调打磨遍历"

  release:
    label: "发布阶段"
    description: "发布准备、平台认证和交付"
    next_phase: null
    steps:
      - id: release-checklist
        name: "发布检查清单"
        command: /release-checklist
        required: true
        description: "跨所有部门的发布前验证：代码、内容、商店、法律"

      - id: patch-notes
        name: "更新说明"
        command: /patch-notes
        required: false
        description: "从 git 历史记录和 Sprint 数据生成面向玩家的更新说明"

      - id: changelog
        name: "变更日志"
        command: /changelog
        required: false
        description: "从 commits、Sprint 和设计文档自动生成内部变更日志"

      - id: launch-checklist
        name: "发布检查清单"
        command: /launch-checklist
        required: true
        description: "最终发布就绪度 — 交付给玩家前的最后一道关卡"
